[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "campuseats"
version = "0.1.0"
description = "Campus food rescue web application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.1.0",
    "Flask-Login>=0.6.0",
    "Flask-SQLAlchemy>=3.1.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "Werkzeug>=3.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
