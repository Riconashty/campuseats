services:
  db:
    image: postgres:16
    container_name: campuseats-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: campuseats
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: campuseats
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuseats -d campuseats"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
