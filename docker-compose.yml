services:
  db:
    image: postgres:16
    container_name: campuseats-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: campuseats
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: campuseats
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuseats -d campuseats"]
      interval: 3s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: campuseats-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://campuseats:devpassword@db:5432/campuseats
      SECRET_KEY: dev-secret-key-change-in-production
      PORT: 5001
      FLASK_DEBUG: 0
    ports:
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
