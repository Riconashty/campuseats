name: CI Verification Gate

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  verify:
    name: Lint, Test & Coverage Gate
    runs-on: ubuntu-latest

    # Real PostgreSQL for tests/postgres: row locks and column limits that the in-memory
    # SQLite database used by the unit tests cannot check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campuseats
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: campuseats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campuseats -d campuseats_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Verify code formatting
        run: |
          ruff format --check .

      - name: Run linter checks
        run: |
          ruff check .

      - name: Run test suite with coverage enforcement
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://campuseats:devpassword@localhost:5432/campuseats_test
          # Fail, rather than skip, if the PostgreSQL tests cannot reach the database
          POSTGRES_TESTS_REQUIRED: "1"
        run: |
          pytest

  e2e:
    name: Docker Compose + Selenium Black Box Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and start the Docker Compose deployment
        run: |
          docker compose up --build --detach

      - name: Wait for the app at http://localhost:5000
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:5000/health/db > /dev/null; then
              echo "App is up."
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in time."
          docker compose logs
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # run-selenium.sh sets E2E_REQUIRED=1, so a browser that will not start or an
      # unreachable app fails this job instead of silently skipping every test
      - name: Run Selenium black box tests against the deployment
        run: |
          ./scripts/run-selenium.sh

      - name: Show container logs
        if: failure()
        run: |
          docker compose logs

      - name: Stop the deployment
        if: always()
        run: |
          docker compose down -v
