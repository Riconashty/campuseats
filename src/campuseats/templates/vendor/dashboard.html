{% extends "base.html" %}

{% block title %}Impact Dashboard | CampusEats{% endblock %}

{% block content %}
<h1 class="mb-4">Impact Dashboard</h1>
<div class="card p-3 mb-3">
    <h5>Total Listings Posted</h5>
    <p class="fs-3 fw-bold">{{ total_listings_posted }}</p>
</div>
<div class="card p-3 mb-3">
    <h5>Total Portions Posted</h5>
    <p class="fs-3 fw-bold">{{ total_portions_posted }}</p>
</div>
<div class="card p-3 mb-3">
    <h5>Portions Picked Up</h5>
    <p class="fs-3 fw-bold">{{ total_portions_picked_up }}</p>
</div>
{% endblock %}
