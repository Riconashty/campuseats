{% extends "base.html" %}

{% block title %}Login | CampusEats{% endblock %}

{% block content %}
<h1>Log In</h1>

<form method="POST">

    <!-- Email Address Field -->
    <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email"
               class="form-control"
               id="email"
               name="email"
               value="{{ email or '' }}"
               required>
    </div>

    <!-- Password Field -->
    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password"
               class="form-control"
               id="password"
               name="password"
               required>
    </div>

    <!-- Login Button -->
    <button type="submit" class="btn btn-primary">
        Log In
    </button>

</form>
{% endblock %}
